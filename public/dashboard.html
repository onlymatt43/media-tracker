<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONLYMATT — Tableau de bord tracking</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  :root{ --bg:#0b0f14; --panel:#131a22; --line:#1f2a35; --ink:#e7edf3; --mut:#8aa0b2; --accent:#10b981; --accent2:#06b6d4; --warn:#f59e0b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap{ max-width:1200px; margin:0 auto; padding:20px 18px 60px; }
  h1{ font-size:19px; margin:0 0 2px; }
  h1 .ca{ color:var(--warn); }
  .sub{ color:var(--mut); font-size:12.5px; margin:0 0 16px; }
  .bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:16px; }
  .bar input, .bar select{ font:inherit; background:#0c141b; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px 9px; }
  .bar label{ color:var(--mut); font-size:12px; display:flex; gap:6px; align-items:center; }
  button{ font:inherit; cursor:pointer; background:var(--accent); border:none; color:#04110b; border-radius:8px; padding:8px 14px; font-weight:600; }
  button:hover{ filter:brightness(1.08); }
  button.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
  .spacer{ flex:1; }
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .n{ font-size:26px; font-weight:700; }
  .kpi .l{ color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .grid{ display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3{ margin:0 0 10px; font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  .chartbox{ position:relative; height:230px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:right; color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:8px 8px; border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  th.l, td.l{ text-align:left; }
  td{ padding:8px 8px; border-bottom:1px solid #172029; text-align:right; white-space:nowrap; }
  tr:hover td{ background:#0f1620; cursor:pointer; }
  .pill{ font-size:11px; padding:1px 7px; border-radius:999px; background:#0c141b; border:1px solid var(--line); color:var(--mut); }
  .bar-mini{ display:inline-block; height:6px; border-radius:3px; background:var(--accent); vertical-align:middle; }
  .msg{ color:var(--mut); padding:30px; text-align:center; }
  .err{ color:#fca5a5; }
  dialog{ background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:14px; max-width:720px; width:92%; padding:0; }
  .dlg{ padding:18px 20px; }
  .dlg h2{ margin:0 0 4px; font-size:16px; }
  .evt{ font-size:12px; border-bottom:1px solid #172029; padding:5px 0; display:grid; grid-template-columns:120px 70px 1fr; gap:8px; color:var(--mut); }
  @media(max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr);} .grid,.grid3{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>ONLYMATT<span class="ca">.ca</span> — Tracking</h1>
  <p class="sub">Données live depuis <code>/api/admin</code>. Le secret reste dans ce navigateur (localStorage), jamais envoyé ailleurs.</p>

  <div class="bar">
    <input id="base" placeholder="Base (vide = même domaine)" size="26">
    <input id="secret" type="password" placeholder="TRACKER_ADMIN_SECRET" size="24">
    <label><input type="checkbox" id="bots"> inclure les bots</label>
    <button onclick="save();load()">Charger</button>
    <button class="ghost" onclick="load()">↻ Rafraîchir</button>
    <div class="spacer"></div>
    <span id="stamp" class="sub" style="margin:0"></span>
  </div>

  <div id="content"></div>

  <footer class="sub" style="margin-top:24px">
    <a href="/privacy?lang=fr" style="color:var(--mut)">Politique de confidentialité</a>
  </footer>
</div>

<dialog id="detail"><div class="dlg" id="detailBody"></div></dialog>

<script>
const $ = id => document.getElementById(id);
let charts = {};
let mediasCache = [], sortKey = 'views', sortDir = -1;

// restore config
$('base').value = localStorage.getItem('om_base') || '';
$('secret').value = localStorage.getItem('om_secret') || '';
$('bots').checked = localStorage.getItem('om_bots') === '1';
function save(){
  localStorage.setItem('om_base', $('base').value.trim());
  localStorage.setItem('om_secret', $('secret').value.trim());
  localStorage.setItem('om_bots', $('bots').checked ? '1':'0');
}
function apiUrl(extra){
  const base = $('base').value.trim().replace(/\/$/,'');
  const bots = $('bots').checked ? '&bots=1' : '';
  return `${base}/api/admin?_=1${bots}${extra||''}`;
}
function apiFetch(extra){
  return fetch(apiUrl(extra), { headers: { 'x-admin-secret': $('secret').value.trim() } });
}
const fmtPct = v => v==null ? '—' : (v*100).toFixed(0)+'%';
const fmtSec = v => v==null ? '—' : Number(v).toFixed(1)+' s';
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load(){
  const c = $('content');
  if(!$('secret').value.trim()){ c.innerHTML = '<div class="msg">Entre ton secret puis « Charger ».</div>'; return; }
  c.innerHTML = '<div class="msg">Chargement…</div>';
  try{
    const r = await apiFetch();
    if(r.status===401){ c.innerHTML = '<div class="msg err">401 — secret invalide.</div>'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    render(d);
    $('stamp').textContent = 'MAJ ' + new Date().toLocaleTimeString();
  }catch(e){
    c.innerHTML = `<div class="msg err">Erreur: ${esc(e.message)}.<br><span class="sub">Si « Failed to fetch » : ouvre cette page depuis le domaine du tracker (même origine), pas en local.</span></div>`;
  }
}

function render(d){
  const t = d.totaux || {};
  const humans = (Number(t.total)||0) - (Number(t.bots)||0);
  mediasCache = d.medias || [];
  $('content').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="n">${humans.toLocaleString()}</div><div class="l">Événements (humains)</div></div>
      <div class="kpi"><div class="n">${(Number(t.medias)||0).toLocaleString()}</div><div class="l">Médias trackés</div></div>
      <div class="kpi"><div class="n">${(Number(t.ips)||0).toLocaleString()}</div><div class="l">Visiteurs uniques (IP)</div></div>
      <div class="kpi"><div class="n">${(Number(t.bots)||0).toLocaleString()}</div><div class="l">Bots filtrés</div></div>
    </div>
    <div class="grid">
      <div class="card"><h3>Activité (30 jours)</h3><div class="chartbox"><canvas id="cDay"></canvas></div></div>
      <div class="card"><h3>Par appareil</h3><div class="chartbox"><canvas id="cDev"></canvas></div></div>
    </div>
    <div class="grid3">
      <div class="card"><h3>Par source / plateforme</h3><div class="chartbox"><canvas id="cSrc"></canvas></div></div>
      <div class="card"><h3>Par pays</h3><div class="chartbox"><canvas id="cCty"></canvas></div></div>
      <div class="card"><h3>Play-rate (top médias)</h3><div class="chartbox"><canvas id="cPlay"></canvas></div></div>
    </div>
    <div class="card">
      <h3>Médias — clique une ligne pour le détail</h3>
      <div style="overflow-x:auto"><table id="tbl"></table></div>
    </div>`;

  drawLine('cDay', (d.par_jour||[]).slice().reverse(), 'd', 'n');
  drawDoughnut('cDev', d.par_appareil||[]);
  drawBar('cSrc', (d.par_source||[]).slice(0,10));
  drawBar('cCty', (d.par_pays||[]).slice(0,10));
  drawPlayRate('cPlay', mediasCache);
  renderTable();
}

function renderTable(){
  const rows = mediasCache.slice().sort((a,b)=>{
    const va=a[sortKey], vb=b[sortKey];
    const na = (sortKey==='play_rate') ? (a.play_rate??-1) : (Number(va)|| (typeof va==='string'? va: -1));
    const nb = (sortKey==='play_rate') ? (b.play_rate??-1) : (Number(vb)|| (typeof vb==='string'? vb: -1));
    if(na<nb) return sortDir; if(na>nb) return -sortDir; return 0;
  });
  const cols = [['title','Média','l'],['category','Cat.','l'],['views','Vues'],['plays','Plays'],['play_rate','Play-rate'],['watch_time_avg','Watch'],['q100','Fini'],['completion_rate','Complétion 25/50/75/100']];
  const head = cols.map(([k,lbl,cls])=>`<th class="${cls||''}" onclick="sortBy('${k}')">${lbl}${sortKey===k?(sortDir<0?' ▾':' ▴'):''}</th>`).join('');
  const body = rows.map(m=>{
    const cr = m.completion_rate||{};
    const comp = ['q25','q50','q75','q100'].map(q=>fmtPct(cr[q])).join(' / ');
    return `<tr onclick="detail('${m.media_uuid}')">
      <td class="l">${esc(m.title||m.media_uuid.slice(0,8))}</td>
      <td class="l"><span class="pill">${esc(m.category||'—')}</span></td>
      <td>${Number(m.views)||0}</td>
      <td>${Number(m.plays)||0}</td>
      <td>${fmtPct(m.play_rate)}</td>
      <td>${fmtSec(m.watch_time_avg)}</td>
      <td>${fmtPct((m.completion_rate||{}).q100)}</td>
      <td>${comp}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" class="msg">Aucun média encore tracké.</td></tr>`;
  $('tbl').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
}
function sortBy(k){ if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=-1; } renderTable(); }

async function detail(uuid){
  const dlg=$('detail'); $('detailBody').innerHTML='<div class="msg">Chargement…</div>'; dlg.showModal();
  try{
    const r = await apiFetch('&uuid='+encodeURIComponent(uuid));
    const d = await r.json();
    const e = d.engagement||{}; const cr=e.completion_rate||{};
    const evts = (d.events||[]).slice(0,40).map(ev=>`<div class="evt"><span>${esc((ev.viewed_at||'').replace('T',' ').slice(0,19))}</span><span>${esc(ev.event_type||'view')}</span><span>${esc(ev.source||ev.referer||ev.country||'')}</span></div>`).join('');
    $('detailBody').innerHTML = `
      <h2>${esc((d.media&&d.media.title)||uuid)}</h2>
      <p class="sub">${esc((d.media&&d.media.category)||'')} · ${uuid}</p>
      <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi"><div class="n">${Number(e.views)||0}</div><div class="l">Vues</div></div>
        <div class="kpi"><div class="n">${Number(e.plays)||0}</div><div class="l">Plays</div></div>
        <div class="kpi"><div class="n">${fmtPct(e.play_rate)}</div><div class="l">Play-rate</div></div>
        <div class="kpi"><div class="n">${fmtSec(e.watch_time_avg)}</div><div class="l">Watch-time</div></div>
      </div>
      <div class="card" style="margin-bottom:12px"><h3>Complétion</h3>
        <div>25% ${fmtPct(cr.q25)} · 50% ${fmtPct(cr.q50)} · 75% ${fmtPct(cr.q75)} · 100% ${fmtPct(cr.q100)}</div></div>
      <div class="card"><h3>Derniers événements</h3>${evts||'<span class="sub">aucun</span>'}</div>
      <div style="text-align:right;margin-top:14px"><button class="ghost" onclick="detail_close()">Fermer</button></div>`;
  }catch(err){ $('detailBody').innerHTML=`<div class="msg err">${esc(err.message)}</div>`; }
}
function detail_close(){ $('detail').close(); }

// ---- charts ----
const GRID='#1f2a35', TICK='#8aa0b2';
function destroy(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function baseOpts(){ return { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ grid:{color:GRID}, ticks:{color:TICK} }, y:{ grid:{color:GRID}, ticks:{color:TICK}, beginAtZero:true } } }; }
function drawLine(id, arr, kx, ky){ destroy(id); charts[id]=new Chart($(id),{type:'line',data:{labels:arr.map(r=>r[kx]),datasets:[{data:arr.map(r=>Number(r[ky])||0),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.15)',fill:true,tension:.3,pointRadius:0}]},options:baseOpts()}); }
function drawBar(id, arr){ destroy(id); charts[id]=new Chart($(id),{type:'bar',data:{labels:arr.map(r=>r.k),datasets:[{data:arr.map(r=>Number(r.n)||0),backgroundColor:'#06b6d4'}]},options:{...baseOpts(),indexAxis:'y'}}); }
function drawDoughnut(id, arr){ destroy(id); charts[id]=new Chart($(id),{type:'doughnut',data:{labels:arr.map(r=>r.k),datasets:[{data:arr.map(r=>Number(r.n)||0),backgroundColor:['#10b981','#06b6d4','#f59e0b','#8b5cf6','#ef4444','#64748b']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:TICK,boxWidth:12}}}}}); }
function drawPlayRate(id, medias){ destroy(id); const m=medias.filter(x=>x.play_rate!=null).sort((a,b)=>b.play_rate-a.play_rate).slice(0,8); charts[id]=new Chart($(id),{type:'bar',data:{labels:m.map(x=>(x.title||x.media_uuid.slice(0,6))),datasets:[{data:m.map(x=>Math.round(x.play_rate*100)),backgroundColor:'#10b981'}]},options:{...baseOpts(),indexAxis:'y',scales:{...baseOpts().scales,x:{...baseOpts().scales.x,max:100}}}}); }

if($('secret').value.trim()) load();
</script>
</body>
</html>
